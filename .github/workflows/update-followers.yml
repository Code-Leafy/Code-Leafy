name: Update GitHub Followers

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch follower count
        id: followers
        shell: bash
        run: |
          FOLLOWERS=$(curl -fsSL https://api.github.com/users/Code-Leafy | jq -r '.followers')

          if [ -z "$FOLLOWERS" ] || [ "$FOLLOWERS" = "null" ]; then
            echo "Failed to fetch follower count"
            exit 1
          fi

          echo "followers=$FOLLOWERS" >> "$GITHUB_OUTPUT"

      - name: Write badge endpoint
        shell: bash
        run: |
          mkdir -p api

          cat > api/followers.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Followers",
            "message": "${{ steps.followers.outputs.followers }}",
            "color": "0d0d0d",
            "labelColor": "0d0d0d",
            "logo": "github"
          }
          EOF

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add api/followers.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update GitHub follower count"
          git push
