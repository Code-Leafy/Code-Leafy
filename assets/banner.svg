<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="180" fill="#0d0d0d"/>
  <rect x="0.5" y="0.5" width="899" height="179" fill="none" stroke="#2a2a2a" stroke-width="1"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="32" fill="#141414"/>
  <line x1="0" y1="32" x2="900" y2="32" stroke="#2a2a2a" stroke-width="1"/>
  <circle cx="18" cy="16" r="5" fill="#3a3a3a"/>
  <circle cx="36" cy="16" r="5" fill="#3a3a3a"/>
  <circle cx="54" cy="16" r="5" fill="#3a3a3a"/>
  <text x="450" y="21" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#666" text-anchor="middle">user@code-leafy: ~</text>

  <!-- real github avatar -->
  <defs>
    <clipPath id="avatar-clip">
      <circle cx="852" cy="90" r="22"/>
    </clipPath>
  </defs>
  <circle cx="852" cy="90" r="23" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
  <image href="https://avatars.githubusercontent.com/u/186628927?v=4" x="830" y="68" width="44" height="44" clip-path="url(#avatar-clip)"/>

  <!-- body -->
  <text x="32" y="72" font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#555">
    <tspan fill="#4a4a4a">$</tspan> whoami
  </text>

  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="28" font-weight="700" fill="#eaeaea">
    <text x="32" y="112">CodeLeafy</text>
    <rect x="30" y="90" width="0" height="30" fill="#0d0d0d">
      <animate attributeName="width" values="215;215;0" keyTimes="0;0.02;1" dur="0.01s" fill="freeze"/>
    </rect>
  </g>
  <rect x="248" y="90" width="11" height="28" fill="#eaeaea">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="32" y="144" font-family="'JetBrains Mono','Courier New',monospace" font-size="13" fill="#777">
    networking tools / desktop apps / telegram bots
  </text>

  <text x="32" y="166" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#4a4a4a">
    rust · typescript · python · tauri · docker · linux
  </text>
</svg>
